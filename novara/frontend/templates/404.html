<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found — Novara</title>
<meta property="og:title" content="404 — Page Not Found — Novara">
<meta property="og:description" content="The page you're looking for doesn't exist.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="/static/css/main.css">
<style>
  .not-found{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem;background:var(--bg)}
  .not-found h1{font-size:6rem;margin:0;color:var(--accent);line-height:1}
  .not-found h2{font-size:1.5rem;margin:.5rem 0 1rem;color:var(--text2)}
  .not-found p{color:var(--text3);margin-bottom:2rem;max-width:400px}
  .not-found a{color:var(--accent);text-decoration:none;font-weight:600}
  .not-found a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="not-found">
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  <a href="/" class="btn-primary" style="display:inline-block;padding:.75rem 2rem;border-radius:var(--radius);background:var(--accent);color:#fff;text-decoration:none;font-weight:600">← Back to Home</a>
</div>
</body>
</html>
