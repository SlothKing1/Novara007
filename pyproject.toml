[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novara"
version = "0.1.0"
description = "Multi-source web novel ingestion and serving platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    # Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # HTTP client
    "httpx>=0.28.0",
    # HTML parsing
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    # Text processing
    "bleach>=6.2.0",
    "ftfy>=6.3.0",
    # Similarity / matching
    "rapidfuzz>=3.10.0",
    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    # Cloudflare bypass (tier 2: cloudscraper, tier 3: curl_cffi TLS fingerprint)
    "cloudscraper>=1.2.71",
    "curl-cffi>=0.7.0",
    # Utilities
    "python-slugify>=8.0.4",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "pillow>=11.0.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.1",
    "respx>=0.22.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "types-beautifulsoup4>=4.12.0",
    "types-python-slugify>=8.0.2",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
novara = "novara.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=novara --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["novara"]
