services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: novara
      POSTGRES_PASSWORD: novara
      POSTGRES_DB: novara
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novara"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn novara.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://novara:novara@db:5432/novara
      SYNC_DATABASE_URL: postgresql+psycopg2://novara:novara@db:5432/novara
      REDIS_URL: redis://redis:6379/0
      NOVARA_ENV: development
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A novara.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://novara:novara@db:5432/novara
      SYNC_DATABASE_URL: postgresql+psycopg2://novara:novara@db:5432/novara
      REDIS_URL: redis://redis:6379/0
      NOVARA_ENV: development
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://novara:novara@db:5432/novara
      SYNC_DATABASE_URL: postgresql+psycopg2://novara:novara@db:5432/novara
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

volumes:
  postgres_data:
